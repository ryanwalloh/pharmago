# Nixpacks configuration for Railway deployment
# Handles migrations and static files BEFORE starting the web server
# 
# Note: Nixpacks automatically detects Python and requirements.txt
# We only override the build phase (collectstatic) and start phase (migrations + daphne)

[phases.setup]
aptPkgs = ["redis-tools"]

[phases.build]
cmds = [
    "python manage.py collectstatic --noinput --clear"
]

[start]
cmd = "bash ./scripts/start_server.sh"

